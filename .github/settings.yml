# Repository metadata for jebradfield/slopslayer
#
# GitHub does not read this file. The description and topics are typed into the About box
# on the repo page. This file is the written record of what was typed there and why.
#
# If you change the description or topics on GitHub, change them here in the same commit.
# Otherwise this file becomes a confident record of something that is no longer true.
#
# Topic counts are GitHub repository counts as of 2026-08-27, kept so a future reader can
# tell whether a tag was chosen for reach or for precision.

repository:
  name: slopslayer
  description: >-
    Agent skill that strips AI writing patterns and restores human voice. Merges
    stop-slop and Cursor's unslop. Works with Claude Code, Codex, Cursor, and claude.ai.

  # Eight topics covering four angles: what it is, where it runs, what it does, and the
  # term the community uses for the problem. GitHub allows 20; past ten dilutes the
  # strong tags. Rules: lowercase, numbers, hyphens, 50 characters or less each.
  topics:
    - agent-skills      # 18,020 repos  - what it is
    - claude-skills     #  7,499 repos  - what it is
    - claude-code       # 64,726 repos  - where it runs
    - codex             # 26,780 repos  - where it runs
    - cursor            # 13,241 repos  - where it runs
    - ai-writing        #  1,057 repos  - what it does
    - writing-tools     #    498 repos  - what it does
    - ai-slop           #    290 repos  - the problem, in the community's own word

  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

  default_branch: main

  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
